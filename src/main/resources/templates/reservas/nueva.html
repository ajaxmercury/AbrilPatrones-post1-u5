<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reserva</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="datetime-local"], select { 
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn-secondary { background-color: #6c757d; }
        .text-danger { color: #dc3545; font-size: 0.9em; display: block; margin-top: 5px; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .container { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nueva Reserva</h1>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/reservas}" th:object="${reserva}" method="post">
            <div class="form-group">
                <label for="laboratorio">Laboratorio:</label>
                <select id="laboratorio" th:field="*{laboratorio.id}">
                    <option value="">-- Seleccione un laboratorio --</option>
                    <option th:each="lab : ${laboratorios}" 
                            th:value="${lab.id}" 
                            th:text="${lab.nombre + ' - ' + lab.ubicacion}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="nombreSolicitante">Nombre del Solicitante:</label>
                <input type="text" id="nombreSolicitante" th:field="*{nombreSolicitante}" />
                <span class="text-danger" th:if="${#fields.hasErrors('nombreSolicitante')}" th:errors="*{nombreSolicitante}"></span>
            </div>

            <div class="form-group">
                <label for="correoSolicitante">Correo del Solicitante:</label>
                <input type="email" id="correoSolicitante" th:field="*{correoSolicitante}" />
                <span class="text-danger" th:if="${#fields.hasErrors('correoSolicitante')}" th:errors="*{correoSolicitante}"></span>
            </div>

            <div class="form-group">
                <label for="inicio">Fecha y Hora de Inicio:</label>
                <input type="datetime-local" id="inicio" th:field="*{inicio}" />
                <span class="text-danger" th:if="${#fields.hasErrors('inicio')}" th:errors="*{inicio}"></span>
            </div>

            <div class="form-group">
                <label for="fin">Fecha y Hora de Fin:</label>
                <input type="datetime-local" id="fin" th:field="*{fin}" />
                <span class="text-danger" th:if="${#fields.hasErrors('fin')}" th:errors="*{fin}"></span>
            </div>

            <div class="form-group">
                <label for="motivo">Motivo (Opcional):</label>
                <input type="text" id="motivo" th:field="*{motivo}" />
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <button type="submit" class="btn">Guardar Reserva</button>
                <a href="/reservas" class="btn btn-secondary">Volver</a>
            </div>
        </form>
    </div>
</body>
</html>
