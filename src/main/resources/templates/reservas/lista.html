<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas de Laboratorios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn { padding: 8px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer;}
        .btn-danger { background-color: #dc3545; }
        .mb-3 { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Reservas de Laboratorios</h1>
    
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="mb-3">
        <a href="/reservas/nueva" class="btn">Nueva Reserva</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Laboratorio</th>
                <th>Solicitante</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.laboratorio.nombre}"></td>
                <td th:text="${reserva.nombreSolicitante}"></td>
                <td th:text="${#temporals.format(reserva.inicio, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(reserva.fin, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${reserva.estado}"></td>
                <td>
                    <form th:if="${reserva.estado.name() != 'CANCELADA'}" 
                          th:action="@{/reservas/{id}/cancelar(id=${reserva.id})}" 
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="6" style="text-align: center;">No hay reservas registradas.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
